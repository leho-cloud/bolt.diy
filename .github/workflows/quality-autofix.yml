name: ESLint automatikus javítás (külön ág)

on:
  push:
    branches:
      - quality/eslint-autofix-20261018
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Javítható ESLint-problémák
        run: pnpm exec eslint app --fix || true
      - name: Javítások rögzítése kizárólag a javítóágra
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app
          if ! git diff --cached --quiet; then
            git commit -m "style: apply mechanical ESLint fixes"
            git push origin HEAD:quality/eslint-autofix-20261018
          fi
      - name: Típusellenőrzés
        run: pnpm run typecheck
      - name: ESLint állapot
        run: pnpm run lint
