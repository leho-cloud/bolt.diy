name: Publisher contract (no deployment)

on:
  push:
    branches: [dev/tzsvtav-publisher-guard-20261019]
    paths:
      - app/routes/api.coolify-publish.ts
      - scripts/check-coolify-publish.mjs
      - .github/workflows/publisher-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/check-coolify-publish.mjs
